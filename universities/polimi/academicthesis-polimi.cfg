%%
%% academicthesis-polimi.cfg
%% --------------------------------------------------------------
%% Early configuration of the Politecnico di Milano plugin, read by
%% academicthesis.cls BEFORE it loads its base class (expl3 syntax is
%% on here: spaces are ignored). The rest of the plugin is
%% academicthesis-polimi.sty.
%%--------------------------------------------------------------
\ProvidesFile{academicthesis-polimi.cfg}[2026/10/10 v0.1.0 PoliMi early configuration]

% The official PoliMi layouts; `classical' is the default, except for a
% PhD (degree option `phd'), whose default is the `phd' layout.
\bool_if:NT \g__academicthesis_phd_bool
  {
    \tl_if_empty:NT \g__academicthesis_format_tl
      { \tl_gset:Nn \g__academicthesis_format_tl { phd } }
  }
\DeclareThesisFormats { classical , article , summary , phd } { classical }

% format=phd is the doctoral dissertation: it needs the `phd' degree.
\msg_new:nnnn { academicthesis } { polimi-phd-needs-phd }
  { format=phd~is~the~PoliMi~doctoral~dissertation:~use~the~`phd'~degree. }
  { e.g.~\exp_not:N\documentclass[university=polimi,~phd,~format=phd]{academicthesis} }
\str_if_eq:VnT \g__academicthesis_format_tl { phd }
  {
    \bool_if:NF \g__academicthesis_phd_bool
      { \msg_error:nn { academicthesis } { polimi-phd-needs-phd } }
  }

\msg_new:nnnn { academicthesis } { polimi-format-not-implemented }
  { PoliMi~format~'#1'~is~not~implemented~yet;~using~'classical'. }
  { Available:~format=classical,~article,~summary,~phd. }

% Each format picks its own base class: classical is a book (12pt,
% two-sided, A4), article an article (11pt, A4), summary (the executive
% summary) a two-column article (11pt, A4), phd (the doctoral
% dissertation) a book (10pt, two-sided, chapters on the right; the page
% size, 17x24cm by default, is set by the layout).
\str_case:VnF \g__academicthesis_format_tl
  {
    { classical } { \DeclareThesisBaseClass { book } { 12pt , twoside , a4paper } }
    { article }   { \DeclareThesisBaseClass { article } { 11pt , a4paper } }
    { summary }   { \DeclareThesisBaseClass { article } { 11pt , a4paper , twocolumn } }
    { phd }       { \DeclareThesisBaseClass { book } { 10pt , twoside , openright } }
  }
  {
    \msg_error:nne { academicthesis } { polimi-format-not-implemented }
      { \g__academicthesis_format_tl }
    \tl_gset:Nn \g__academicthesis_format_tl { classical }
    \DeclareThesisBaseClass { book } { 12pt , twoside , a4paper }
  }

% No examination-commission / copyright page (users may still ask for
% it with the `secondpage' class option).
\DeclareThesisSecondPage { false }

% Every PoliMi thesis has an English AND an Italian abstract.
\DeclareThesisOtherLanguages { english , italian }

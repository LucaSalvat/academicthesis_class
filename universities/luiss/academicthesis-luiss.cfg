%%
%% academicthesis-luiss.cfg
%% --------------------------------------------------------------
%% Early configuration of the LUISS plugin, read by academicthesis.cls
%% BEFORE it loads its base class (expl3 syntax is on: spaces ignored).
%% The rest of the plugin is academicthesis-luiss.sty.
%%--------------------------------------------------------------
\ProvidesFile{academicthesis-luiss.cfg}[2026/10/10 v0.2.0 LUISS early configuration]

% LUISS theses are books, with the class defaults (the user chooses
% size, sides, ...).
\DeclareThesisBaseClass { book } { }

% Second page (commission + copyright): on by default; users opt out
% with the `no-secondpage' class option.
\DeclareThesisSecondPage { true }

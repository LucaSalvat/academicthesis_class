%%
%% academicthesis-bocconi.cfg
%% --------------------------------------------------------------
%% Early configuration of the Bocconi plugin, read by academicthesis.cls
%% BEFORE it loads its base class (expl3 syntax is on: spaces ignored).
%% The rest of the plugin is academicthesis-bocconi.sty.
%%--------------------------------------------------------------
\ProvidesFile{academicthesis-bocconi.cfg}[2026/10/19 v0.1.0 Bocconi early configuration]

% Bocconi theses are books, with the class defaults (the user chooses
% size, sides, ...), as for LUISS.
\DeclareThesisBaseClass { book } { }

% simil_frontpages (class option, default false)
%   false: the official front page is added by the university, so the
%          thesis starts with two blank pages for it; no field is required.
%   true:  the thesis prints its own front page (a "simil" front page),
%          with the same required fields as LUISS.
% `simil_frontpage' (singular) is accepted too.
\DeclareThesisClassOption { simil_frontpages } { false }
\DeclareThesisClassOption { simil_frontpage }  { false }

\msg_new:nnnn { academicthesis } { bocconi-simil-value }
  { simil_frontpages~must~be~true~or~false~(got~'#1'). }
  { e.g.~\exp_not:N\documentclass[university=bocconi,~bachelor,~simil_frontpages=true]{academicthesis} }

\bool_new:N \g__bocconi_simil_bool
\clist_map_inline:nn { simil_frontpages , simil_frontpage }
  {
    \str_case_e:nnF { \academicthesis_class_option:n { #1 } }
      {
        { true }  { \bool_gset_true:N \g__bocconi_simil_bool }
        { false } { }
      }
      {
        \msg_error:nne { academicthesis } { bocconi-simil-value }
          { \academicthesis_class_option:n { #1 } }
      }
  }

% Without a simil front page there is nothing to check and no second
% page (commission + copyright) after the blank pages.
\bool_if:NF \g__bocconi_simil_bool
  {
    \DeclareThesisCoreRequirements { false }
    \DeclareThesisSecondPage { false }
  }
